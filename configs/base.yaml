# configs/base.yaml
# Single source of truth for all experiment hyperparameters.
# All scripts read from this file — never hardcode values elsewhere.

# Reproducibility
seed: 42

# Models
models:
  deit_small:
    timm_name: "deit_small_patch16_224"
    hf_name: "facebook/deit-small-patch16-224"
    num_classes: 1000
    input_size: 224

# Compression
compression:
  levels: ["fp32", "int8", "int4"]
  int8:
    backend: "bitsandbytes"
    method: "Linear8bitLt"   # true int8 via bitsandbytes — requires sm_70+ (T4 is sm_75)
  int4:
    backend: "bitsandbytes"
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "float16"

# Dataset
# `name` is the ONLY switch — flip it between "imagenette" and "tiny-imagenet".
# load_config() flattens the active sub-block up into `dataset`, so every
# downstream `cfg["dataset"]["val_dir"]` etc. keeps working unchanged.
# `mean`/`std` are shared: both datasets feed the same ImageNet-pretrained DeiT-S.
dataset:
  name: "tiny-imagenet"
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

  imagenette:
    # imagenette's 10 folders ARE ImageNet-1k classes, so the frozen pretrained
    # 1000-way head classifies them directly (label_mode: imagenet remaps the 10
    # folders → their true ImageNet indices). No fine-tuning needed.
    num_classes: 1000
    label_mode: imagenet
    resize: 256             # Resize(256) → CenterCrop(224) — standard ImageNet preprocessing
    val_subset_size: 3925   # ImageNette val has ~3925 images total — use all of them
    train_subset_size: 9469  # ImageNette train has ~9469 images total — use all of them
    # Kaggle: attach adityakane/imagenette2 in notebook settings.
    # Extract the archive once per session (see CLAUDE.md → Kaggle session startup).
    val_dir: "/kaggle/working/imagenette2/val"
    train_dir: "/kaggle/working/imagenette2/train"

  tiny-imagenet:
    # tiny-imagenet's 200 classes at 64px→224 are too degraded for the frozen
    # ImageNet head (clean_acc ~0.48, AT can't recover robustness). Instead we
    # fine-tune DeiT-S with a fresh 200-way head (scripts/finetune_backbone.py)
    # and use RAW 0..199 ImageFolder labels (no ImageNet remap).
    num_classes: 200
    label_mode: raw
    # Fine-tuned base checkpoint (state_dict). Produced by finetune_backbone.py,
    # loaded by models/loader.py as the base BEFORE compression + defense. The
    # <dataset> segment is inserted at runtime by dataset_scoped_dir-style logic;
    # keep this path dataset-agnostic here.
    finetuned_base: "results/checkpoints/base/deit_small_ft.pt"
    resize: 224             # native 64px → 224 direct; 256+crop would discard real content
    val_subset_size: 10000  # Tiny-ImageNet val has 10000 images (50/class × 200)
    train_subset_size: 100000  # Tiny-ImageNet train has 100000 images (500/class × 200)
    # Kaggle: attach the standard tiny-imagenet-200 zip, then run
    #   python scripts/prepare_tiny_imagenet.py --root <src> --out /kaggle/working/tiny_if
    # once per session to build the ImageFolder-ready val_if/train_if dirs.
    # NOTE: output must be a WRITABLE dir. On Kaggle the dataset mount (and any
    # symlink to it) is read-only, so we write the _if folders to /kaggle/working/tiny_if.
    val_dir: "/kaggle/working/tiny_if/val_if"
    train_dir: "/kaggle/working/tiny_if/train_if"
    # The 200-class synset→ImageNet map is built at runtime from this file
    # (falls back to <train_dir>/../wnids.txt if omitted). No paste step needed.
    wnids: "/kaggle/working/tiny_if/wnids.txt"

# Attack - FGSM
fgsm:
  name: "fgsm"
  eps: 0.03137 #adds noise
  targeted: false

# Attack - PGD
pgd:
  eps: 0.03137      # 8/255 — same as FGSM
  alpha: 0.00784    # 2/255 — step size
  steps: 20         # standard in robustness literature

# Attack - Adversarial Patch
patch:
  patch_size: 32    # 32x32 patch on 224x224 image (~2% of image area)
  steps: 150        # patch needs more steps than PGD
  lr: 0.05

# Supervised fine-tune (produces the finetuned_base checkpoint for datasets whose
# frozen ImageNet head is inadequate, e.g. tiny-imagenet). Non-adversarial.
finetune:
  epochs: 5
  lr: 0.0001
  weight_decay: 0.05
  batch_size: 64

# Defense - Adversarial Training (AT)
defense:
  name: "adversarial_training"
  epochs: 7
  optimizer: "adamw"
  # Per-compression learning rates.
  # AdamW + layer-freezing requires much lower LRs than SGD full fine-tune.
  # INT8/INT4 quantised weights are especially fragile — keep LR tiny.
  lr:
    fp32: 0.00001
    int8: 0.000005
    int4: 0.000001
  weight_decay: 0.01
  warmup_epochs: 1   # epoch 1 runs at lr/10; full lr from epoch 2 onward
  batch_size: 16     # T4 16GB — keep at 16 for training stability
  at_eps: 0.03137    # 8/255 — must match attack epsilon
  save_every_epoch: true
  # FGSM-RS (Wong et al. 2020, "Fast is better than free"): start the FGSM
  # step from a random point inside the eps-ball instead of the clean image.
  # Mitigates catastrophic overfitting, the documented failure mode of pure
  # single-step FGSM AT (model exploits local linearity around clean images,
  # collapsing clean_acc and PGD robustness while train_adv_acc looks fine).
  random_start: true
  # Fraction of each batch trained on the ORIGINAL clean images instead of
  # adversarial ones (0.0 = pure AT, matches the original spec). Keeps the
  # decision boundary anchored to the clean data distribution.
  clean_batch_frac: 0.5

# Defense - AT + Knowledge Distillation (AT+KD)
at_kd:
  temperature: 4.0   # softmax temperature for soft labels
  alpha: 0.5         # weight for CE loss; (1-alpha) weights KL loss

# Evaluation
eval:
  batch_size: 32     # T4 16GB handles 32 comfortably for DeiT-S inference
  num_workers: 2     # Kaggle gives 4 CPU cores; 2 workers avoids DataLoader overhead

# Paths
paths:
  results_dir: "results"
  figures_dir: "results/figures"
  checkpoints_at_dir: "results/checkpoints/at"
  checkpoints_atkd_dir: "results/checkpoints/atkd"
